name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      # No keys and no network are needed: tests/conftest.py sets dummy keys and blocks every connection.
      - name: Run the tests
        run: uv run --group dev pytest -q
